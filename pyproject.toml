[project]
name = "code-scanner"
version = "1.2.0"
description = "Local static security scanner for source-code repositories"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
code-scanner = "scanner:main"

[tool.setuptools]
py-modules = [
    "scanner",
    "rules",
    "models",
    "utils",
    "baseline",
    "sarif",
    "python_ast",
    "manifests",
    "incidents",
    "html_report",
]
